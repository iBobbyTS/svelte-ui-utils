# npm release publish via Trusted Publishing (OIDC).
#
# Trusted publishing is configured per package on npmjs.com (package Settings
# → Trusted publishing → GitHub Actions) against this exact workflow filename
# and requires a GitHub-hosted runner with id-token: write and NO npm token in
# the environment: npm >= 11.5.1 exchanges the runner's OIDC identity
# automatically.  Publishing from forks or with a mismatched repository.url
# in package.json fails closed.
name: npm publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The committed lockfile pins devDependencies for the check/test/package
      # gates.
      - name: Install dependencies
        run: npm ci

      - name: Type check (svelte-check)
        run: npm run check

      - name: Test (vitest)
        run: npm test

      # A tag must publish exactly the version it names; a mismatch fails
      # before the package is built.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v${version}" >&2
            exit 1
          fi

      # prepublishOnly builds dist/ (svelte-package) before npm packs the
      # tarball; no NODE_AUTH_TOKEN is set — the OIDC identity from
      # id-token: write is the only credential.
      - name: Publish
        run: npm publish --access public
